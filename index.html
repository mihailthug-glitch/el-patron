<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>EL PATRÓN — Tap Empire</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-dark: #0e0c0a;
      --bg-card: #1a1612;
      --bg-card-hover: #241e18;
      --gold: #f5b942;
      --gold-dark: #b8811e;
      --green: #38d96c;
      --text-main: #f7f3eb;
      --text-muted: #9e9384;
      --border: rgba(245, 185, 66, 0.22);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #261d14 0%, var(--bg-dark) 75%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      touch-action: manipulation;
    }

    /* Шапка профиля */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px 8px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    .rank-badge {
      background: linear-gradient(135deg, rgba(245, 185, 66, 0.2), rgba(184, 129, 30, 0.1));
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* Прогресс-бар ранга */
    .rank-progress-wrap {
      padding: 0 16px;
      margin-bottom: 10px;
    }

    .rank-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: #231e19;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold));
      transition: width 0.2s ease;
    }

    /* Статистика (доход в сек / тап) */
    .stats-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 16px;
      margin-bottom: 12px;
    }

    .stat-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      text-align: center;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
    }

    .stat-value.green {
      color: var(--green);
    }

    /* Баланс */
    .balance-section {
      text-align: center;
      margin: 4px 0 14px;
    }

    .balance-amount {
      font-size: 40px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 20px rgba(245, 185, 66, 0.25);
    }

    .balance-amount span {
      color: var(--green);
    }

    /* Главная кнопка-персонаж */
    .tap-area {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 4px auto 16px;
      width: 245px;
      height: 245px;
    }

    .tap-glow {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245, 185, 66, 0.35) 0%, transparent 70%);
      animation: pulseGlow 3s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.96); opacity: 0.7; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .character-btn {
      position: relative;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      border: 4px solid var(--gold);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(245, 185, 66, 0.4);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      background: #1f1914;
    }

    .character-btn:active,
    .character-btn.tapped {
      transform: scale(0.93);
    }

    .character-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      pointer-events: none;
    }

    /* Вылетающие цифры */
    .floating-number {
      position: fixed;
      font-size: 24px;
      font-weight: 900;
      color: var(--green);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 100;
      animation: floatUp 0.85s ease-out forwards;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      30% { transform: translate(-50%, -90%) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -170%) scale(1); }
    }

    /* Энергия */
    .energy-bar-wrap {
      padding: 0 20px;
      margin-bottom: 14px;
    }

    .energy-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .energy-track {
      width: 100%;
      height: 10px;
      background: #231e19;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .energy-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #ff7b00, #ffd000);
      transition: width 0.15s ease;
    }

    /* Магазин улучшений */
    .shop-container {
      flex: 1;
      background: #14110e;
      border-top: 1px solid var(--border);
      border-radius: 24px 24px 0 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shop-title {
      font-size: 15px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--gold);
      margin-bottom: 2px;
    }

    .upgrade-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      transition: background 0.15s, opacity 0.15s;
    }

    .upgrade-card.disabled {
      opacity: 0.52;
    }

    .upgrade-card:not(.disabled):active {
      background: var(--bg-card-hover);
      transform: scale(0.99);
    }

    .upgrade-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .upgrade-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(245, 185, 66, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .upgrade-name {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .upgrade-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .upgrade-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: #140f08;
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 800;
      min-width: 82px;
      text-align: center;
      cursor: pointer;
    }

    .upgrade-card.disabled .upgrade-btn {
      background: #2c2620;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <div class="header">
    <div class="user-badge" id="userName">🎩 Дон</div>
    <div class="rank-badge" id="rankBadge">Уличный дилер</div>
  </div>

  <!-- Прогресс до следующего ранга -->
  <div class="rank-progress-wrap">
    <div class="rank-info">
      <span>Следующий статус</span>
      <span id="nextRankTarget">$1,000</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="rankProgress"></div>
    </div>
  </div>

  <!-- Доход -->
  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">Прибыль за тап</div>
      <div class="stat-value" id="tapPowerDisplay">+$1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Пассив в секунду</div>
      <div class="stat-value green" id="passiveDisplay">+$0/с</div>
    </div>
  </div>

  <!-- Баланс -->
  <div class="balance-section">
    <div class="balance-amount"><span>$</span><span id="balanceDisplay">0</span></div>
  </div>

  <!-- Персонаж -->
  <div class="tap-area">
    <div class="tap-glow"></div>
    <div class="character-btn" id="tapButton">
      <img
        src="./avatar.jpg"
        alt="El Patrón"
        onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22230%22 height=%22230%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23241c15%22/><text x=%2250%25%22 y=%2254%25%22 font-size=%2280%22 text-anchor=%22middle%22>🚬</text></svg>'"
      />
    </div>
  </div>

  <!-- Энергия -->
  <div class="energy-bar-wrap">
    <div class="energy-text">
      <span>⚡ Энергия босса</span>
      <span id="energyDisplay">500 / 500</span>
    </div>
    <div class="energy-track">
      <div class="energy-fill" id="energyFill"></div>
    </div>
  </div>

  <!-- Магазин прокачек -->
  <div class="shop-container">
    <div class="shop-title">💼 Империя и прокачка</div>
    <div id="upgradesList"></div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor('#0e0c0a');
      tg.setBackgroundColor('#0e0c0a');

      const user = tg.initDataUnsafe?.user;
      if (user) {
        const displayName = user.username ? `@${user.username}` : user.first_name;
        document.getElementById('userName').textContent = `🎩 ${displayName}`;
      }
    }

    // Ранги империи
    const RANKS = [
      { name: 'Уличный дилер', threshold: 0 },
      { name: 'Бригадир', threshold: 1000 },
      { name: 'Советник картеля', threshold: 10000 },
      { name: 'Босс Медельина', threshold: 100000 },
      { name: 'Эль Патрон', threshold: 1000000 }
    ];

    // Конфигурация улучшений
    const UPGRADE_CONFIG = [
      {
        id: 'cigar',
        icon: '🚬',
        name: 'Кубинская сигара',
        desc: '+1$ к силе каждого тапа',
        baseCost: 25,
        costMult: 1.55,
        type: 'tap',
        value: 1
      },
      {
        id: 'runners',
        icon: '🏃‍♂️',
        name: 'Уличные бегунки',
        desc: '+2$/сек пассивного кэша',
        baseCost: 60,
        costMult: 1.45,
        type: 'passive',
        value: 2
      },
      {
        id: 'rolex',
        icon: '⌚',
        name: 'Золотой Rolex',
        desc: '+5$ к силе каждого тапа',
        baseCost: 350,
        costMult: 1.6,
        type: 'tap',
        value: 5
      },
      {
        id: 'laundry',
        icon: '💵',
        name: 'Подпольная прачечная',
        desc: '+18$/сек пассивного кэша',
        baseCost: 800,
        costMult: 1.5,
        type: 'passive',
        value: 18
      },
      {
        id: 'whiskey',
        icon: '🥃',
        name: 'Выдержанный виски',
        desc: '+250 к макс. энергии',
        baseCost: 400,
        costMult: 1.75,
        type: 'energy',
        value: 250
      },
      {
        id: 'airfleet',
        icon: '🛩️',
        name: 'Авиапарк в Колумбии',
        desc: '+120$/сек пассивного кэша',
        baseCost: 5000,
        costMult: 1.55,
        type: 'passive',
        value: 120
      }
    ];

    // Состояние игры
    let state = {
      balance: 0,
      totalEarned: 0,
      tapPower: 1,
      passiveIncome: 0,
      energy: 500,
      maxEnergy: 500,
      levels: {}
    };

    // Загрузка сохранения
    function loadGame() {
      try {
        const saved = localStorage.getItem('el_patron_save_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
        }
      } catch (e) {}
    }

    function saveGame() {
      try {
        localStorage.setItem('el_patron_save_v1', JSON.stringify(state));
      } catch (e) {}
    }

    function formatNum(num) {
      return Math.floor(num).toLocaleString('en-US');
    }

    function getUpgradeCost(item) {
      const lvl = state.levels[item.id] || 0;
      return Math.floor(item.baseCost * Math.pow(item.costMult, lvl));
    }

    // Покупка улучшения
    function buyUpgrade(id) {
      const item = UPGRADE_CONFIG.find(u => u.id === id);
      if (!item) return;

      const cost = getUpgradeCost(item);
      if (state.balance < cost) return;

      state.balance -= cost;
      state.levels[id] = (state.levels[id] || 0) + 1;

      if (item.type === 'tap') state.tapPower += item.value;
      if (item.type === 'passive') state.passiveIncome += item.value;
      if (item.type === 'energy') {
        state.maxEnergy += item.value;
        state.energy = Math.min(state.maxEnergy, state.energy + item.value);
      }

      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }

      saveGame();
      renderShop();
      updateUI();
    }

    // Отрисовка магазина
    function renderShop() {
      const list = document.getElementById('upgradesList');
      list.innerHTML = '';

      UPGRADE_CONFIG.forEach(item => {
        const lvl = state.levels[item.id] || 0;
        const cost = getUpgradeCost(item);
        const canAfford = state.balance >= cost;

        const card = document.createElement('div');
        card.className = `upgrade-card ${canAfford ? '' : 'disabled'}`;
        card.onclick = () => buyUpgrade(item.id);

        card.innerHTML = `
          <div class="upgrade-left">
            <div class="upgrade-icon">${item.icon}</div>
            <div>
              <div class="upgrade-name">${item.name} <span style="color:var(--gold);font-size:12px;">ур.${lvl}</span></div>
              <div class="upgrade-desc">${item.desc}</div>
            </div>
          </div>
          <button class="upgrade-btn">$${formatNum(cost)}</button>
        `;
        list.appendChild(card);
      });
    }

    // Обновление цифр на экране
    function updateUI() {
      document.getElementById('balanceDisplay').textContent = formatNum(state.balance);
      document.getElementById('tapPowerDisplay').textContent = `+$${formatNum(state.tapPower)}`;
      document.getElementById('passiveDisplay').textContent = `+$${formatNum(state.passiveIncome)}/с`;
      document.getElementById('energyDisplay').textContent = `${Math.floor(state.energy)} / ${state.maxEnergy}`;
      document.getElementById('energyFill').style.width = `${(state.energy / state.maxEnergy) * 100}%`;

      // Определение ранга
      let currentRankIdx = 0;
      for (let i = RANKS.length - 1; i >= 0; i--) {
        if (state.totalEarned >= RANKS[i].threshold) {
          currentRankIdx = i;
          break;
        }
      }

      const currentRank = RANKS[currentRankIdx];
      const nextRank = RANKS[currentRankIdx + 1];
      document.getElementById('rankBadge').textContent = currentRank.name;

      if (nextRank) {
        const progress = ((state.totalEarned - currentRank.threshold) / (nextRank.threshold - currentRank.threshold)) * 100;
        document.getElementById('rankProgress').style.width = `${Math.min(100, Math.max(0, progress))}%`;
        document.getElementById('nextRankTarget').textContent = `${nextRank.name} ($${formatNum(nextRank.threshold)})`;
      } else {
        document.getElementById('rankProgress').style.width = '100%';
        document.getElementById('nextRankTarget').textContent = 'МАКСИМАЛЬНЫЙ СТАТУС';
      }

      // Обновление доступности кнопок в магазине без перерисовки DOM
      const cards = document.querySelectorAll('.upgrade-card');
      UPGRADE_CONFIG.forEach((item, idx) => {
        const cost = getUpgradeCost(item);
        if (cards[idx]) {
          cards[idx].classList.toggle('disabled', state.balance < cost);
        }
      });
    }

    // Анимация вылетающей цифры
    function spawnFloatingNumber(x, y, amount) {
      const el = document.createElement('div');
      el.className = 'floating-number';
      el.textContent = `+$${formatNum(amount)}`;
      el.style.left = `${x}px`;
      el.style.top = `${y}px`;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 850);
    }

    // Обработка тапа (с поддержкой мультитача через pointerdown)
    const tapBtn = document.getElementById('tapButton');
    tapBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state.energy < 1) return;

      state.energy = Math.max(0, state.energy - 1);
      state.balance += state.tapPower;
      state.totalEarned += state.tapPower;

      // Вибрация в Telegram
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.impactOccurred('medium');
      }

      // Визуальный отклик
      tapBtn.classList.add('tapped');
      setTimeout(() => tapBtn.classList.remove('tapped'), 80);

      spawnFloatingNumber(e.clientX, e.clientY, state.tapPower);
      updateUI();
    });

    // Игровой цикл (пассивный доход + реген энергии раз в 200 мс)
    setInterval(() => {
      if (state.passiveIncome > 0) {
        const gain = state.passiveIncome * 0.2;
        state.balance += gain;
        state.totalEarned += gain;
      }
      if (state.energy < state.maxEnergy) {
        state.energy = Math.min(state.maxEnergy, state.energy + 0.6); // +3 энергии в секунду
      }
      updateUI();
    }, 200);

    // Автосохранение каждые 5 секунд
    setInterval(saveGame, 5000);

    // Старт
    loadGame();
    renderShop();
    updateUI();
  </script>
</body>
  </html>
